services:
  ollama:
    image: ollama/ollama:latest
    container_name: local_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: chat_backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - MODEL=qwen2.5:1.5b
      - ZEUS_PASSCODE=1234
      - OLLAMA_KEEP_ALIVE=30m
    depends_on:
      - ollama

volumes:
  ollama_data: