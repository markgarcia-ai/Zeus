<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Zeus AI Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <section id="loginPage" class="login-page">
    <div class="login-card">
      <h1>⚡ Zeus</h1>
      <p>Your private AI assistant</p>

      <input
        id="passcodeInput"
        type="password"
        placeholder="Enter passcode"
      />

      <button onclick="login()">Enter Zeus</button>

      <p id="loginError" class="error"></p>
    </div>
  </section>

  <section id="chatPage" class="app hidden">
    <header>
      <h1>⚡ Zeus</h1>
      <p>Talk or type to Zeus</p>
    </header>

    <main>
      <div id="chatBox" class="chat-box">
        <div class="message assistant">
          Hello, I am Zeus. You can type to me or press Talk and speak.
        </div>
      </div>

      <div class="controls">
        <button id="talkButton" onclick="startListening()">🎙️ Talk</button>
        <button onclick="stopSpeaking()">🔇 Stop Voice</button>
      </div>

      <form id="chatForm">
        <input
          id="messageInput"
          type="text"
          placeholder="Type your message to Zeus..."
          autocomplete="off"
        />
        <button type="submit">Send</button>
      </form>
    </main>
  </section>

  <script src="app.js"></script>
</body>
</html>
